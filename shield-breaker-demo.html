<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星核破盾：2D Roguelite Demo</title>
  <style>
    :root{--ink:#eaf4ff;--muted:#9aacc8;--aqua:#55e6d1;--pink:#fa7185;--gold:#fbbf24;--panel:#101b34e8;--line:#2b4168;--bg:#050915}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#14264d 0,#050915 55%);color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif}#shell{width:min(100%,1050px);padding:18px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}h1{font-size:22px;margin:0;letter-spacing:.08em}.sub{color:var(--muted);font-size:13px}.game-frame{position:relative;border:1px solid var(--line);box-shadow:0 16px 56px #0008;background:#070d1e;overflow:hidden}canvas{width:100%;height:auto;display:block;aspect-ratio:16/9;cursor:crosshair}.hud{position:absolute;inset:0;padding:14px;pointer-events:none;font-variant-numeric:tabular-nums}.top{display:flex;justify-content:space-between;gap:12px}.meter{width:min(290px,35vw);text-shadow:0 2px 3px #000}.label{font-size:12px;font-weight:700;letter-spacing:.08em}.track{height:9px;background:#111c33;border-radius:99px;overflow:hidden;margin-top:4px}.fill{height:100%;transition:width .1s}.hp{background:linear-gradient(90deg,#fb7185,#fda4af)}.boss{background:linear-gradient(90deg,#fbbf24,#fde68a)}.energy{background:linear-gradient(90deg,#55e6d1,#67e8f9)}.right{text-align:right}.mid{position:absolute;left:50%;top:12px;transform:translateX(-50%);text-align:center;text-shadow:0 2px 4px #000}.time{font-size:26px;font-weight:700}.status{font-size:12px;color:var(--aqua);min-height:18px}.bottom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);text-align:center;width:min(500px,80%)}.hint{font-size:13px;color:#d6e4fa;margin-top:7px}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#081127d9,#081127f2);padding:20px}.card{width:min(760px,100%);text-align:center}.card h2{font-size:29px;margin:0 0 8px}.card p{color:var(--muted);margin:0 auto 20px;max-width:610px;line-height:1.65}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mode{font:inherit;color:var(--ink);text-align:left;padding:18px;border:1px solid var(--line);background:#0c1730;border-radius:10px;cursor:pointer;transition:.15s}.mode:hover,.mode:focus{border-color:var(--aqua);background:#122344;transform:translateY(-2px)}.mode strong{display:block;font-size:19px;margin-bottom:8px}.mode span{display:block;font-size:13px;color:var(--muted);line-height:1.65}.mode b{color:var(--aqua)}.footer{font-size:12px;color:var(--muted);margin-top:18px}.end{display:none}.end .result{font-size:18px;line-height:1.8;margin:18px 0;color:#d6e4fa}.restart{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 24px;color:#04131a;background:var(--aqua);cursor:pointer}.log-toggle{font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 16px;color:var(--ink);background:#152542;cursor:pointer;margin-right:8px}.energy-log{max-width:520px;max-height:180px;overflow:auto;margin:16px auto;text-align:left;background:#091327;border:1px solid var(--line);border-radius:8px;padding:12px;color:#d6e4fa;font-size:14px;line-height:1.75}.energy-log[hidden]{display:none}@media(max-width:620px){#shell{padding:0}header{padding:12px 14px}h1{font-size:16px}.sub{display:none}.game-frame{border-left:0;border-right:0}.hud{padding:8px}.meter{width:34vw}.time{font-size:19px}.modes{grid-template-columns:1fr}.card h2{font-size:24px}.mode{padding:13px}.bottom{bottom:7px}.hint{font-size:11px}}
  </style>
</head>
<body>
  <main id="shell">
    <header><h1>星核破盾</h1><div class="sub">2D Roguelite ・ 共用測試關卡</div></header>
    <section class="game-frame" aria-label="星核破盾遊戲">
      <canvas id="game" width="960" height="540" aria-label="遊戲畫面"></canvas>
      <div class="hud" id="hud" hidden>
        <div class="top"><div class="meter"><div class="label">玩家生命 <span id="hpText"></span></div><div class="track"><div id="hpBar" class="fill hp"></div></div></div><div class="meter right"><div class="label">BOSS 核心 <span id="bossText"></span></div><div class="track"><div id="bossBar" class="fill boss"></div></div></div></div>
        <div class="mid"><div class="time" id="timer">00:00</div><div class="status" id="status">殲滅小怪，蒐集能量</div></div>
        <div class="bottom"><div class="label">破盾能量 <span id="energyText"></span></div><div class="track"><div id="energyBar" class="fill energy"></div></div><div class="hint" id="hint"><b>WASD</b> 移動 ・ 滑鼠瞄準 ・ 自動射擊 ・ 能量滿後按 <b>空白鍵</b> 發動破盾</div></div>
      </div>
      <div class="overlay" id="start"><div class="card"><h2>選擇戰鬥節奏</h2><p>同一張測試關卡、同樣敵潮與 Boss 攻擊。唯一的差異是蒐能與破盾的節奏。</p><div class="modes"><button class="mode" data-mode="high"><strong>高頻</strong><span><b>10 能量／小怪</b><br>需破盾 10 次<br>頻繁累積與爆發</span></button><button class="mode" data-mode="normal"><strong>正常</strong><span><b>5 能量／小怪</b><br>需破盾 5 次<br>標準平衡節奏</span></button><button class="mode" data-mode="low"><strong>低頻</strong><span><b>3 能量／小怪</b><br>需破盾 3 次<br>每次破盾更有份量</span></button></div><div class="footer">每擊殺 20 隻小怪，回復最大生命 10% ・ Boss 每 15 秒預告攻擊</div></div></div>
      <div class="overlay end" id="end"><div class="card"><h2 id="endTitle">任務結束</h2><div class="result" id="endResult"></div><div class="energy-log" id="energyLog" hidden></div><button class="log-toggle" id="logToggle">查看能量紀錄</button><button class="restart" id="restart">回到模式選擇</button></div></div>
    </section>
  </main>
  <script>
  (()=>{
    const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;
    const $=id=>document.getElementById(id), hud=$('hud'),start=$('start'),end=$('end');
    const modes={high:{name:'高頻',gain:10,breaks:10},normal:{name:'正常',gain:5,breaks:5},low:{name:'低頻',gain:3,breaks:3}};
    let g,mouse={x:W/2,y:H/2},last=0,raf;
    const keys={w:false,a:false,s:false,d:false};
    const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
    function newGame(key){const m=modes[key];g={key,m,run:true,t:0,spawn:0,shot:0,nextPattern:15,attack:null,weak:0,hp:100,boss:100,energy:0,kills:0,breaks:0,energyLog:[],player:{x:W/2,y:H*.63,r:13,hit:0,speed:210},enemies:[],shots:[],bossShots:[],particles:[],banner:2.5};Object.keys(keys).forEach(k=>keys[k]=false);$('energyLog').hidden=true;$('logToggle').textContent='查看能量紀錄';hud.hidden=false;start.style.display='none';end.style.display='none';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
    function spawnEnemy(){const side=Math.floor(Math.random()*4),margin=25;let p=side===0?{x:Math.random()*W,y:-margin}:side===1?{x:W+margin,y:Math.random()*H}:side===2?{x:Math.random()*W,y:H+margin}:{x:-margin,y:Math.random()*H};g.enemies.push({...p,r:8+Math.random()*5,hp:2,speed:35+Math.random()*22,color:Math.random()<.28?'#b48cff':'#70d6ff'})}
    function fire(){const p=g.player,a=Math.atan2(mouse.y-p.y,mouse.x-p.x);g.shots.push({x:p.x+Math.cos(a)*18,y:p.y+Math.sin(a)*18,vx:Math.cos(a)*480,vy:Math.sin(a)*480,r:3,life:1.2})}
    function startAttack(){const type=Math.floor(Math.random()*3),p=g.player;let attack={type,phase:'warn',timer:2};if(type===0){attack.angle=Math.atan2(p.y-92,p.x-W/2);g.status='警告：扇形彈幕將朝預告方向射出！'}if(type===1){attack.spots=[{x:clamp(p.x,60,W-60),y:clamp(p.y,145,H-60),r:55},{x:80+Math.random()*(W-160),y:150+Math.random()*(H-220),r:48},{x:80+Math.random()*(W-160),y:150+Math.random()*(H-220),r:48}];g.status='警告：閃電轟炸將在 2 秒後發動！'}if(type===2){attack.angle=Math.atan2(p.y-92,p.x-W/2);g.status='警告：Boss 正在鎖定雷射路徑！'}g.attack=attack}
    function bossFire(attack){const origin={x:W/2,y:92};if(attack.type===0){const count=19;for(let i=0;i<count;i++){let a=attack.angle+(i/(count-1)-.5)*2.3;g.bossShots.push({x:origin.x,y:origin.y,vx:Math.cos(a)*142,vy:Math.sin(a)*142,r:6,life:6})}}else if(attack.type===1){attack.spots.forEach(s=>{if(dist(s,g.player)<s.r+g.player.r)hitPlayer(28);for(let n=0;n<18;n++){const a=Math.random()*Math.PI*2,sp=30+Math.random()*160;g.particles.push({x:s.x,y:s.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.6,color:'#a5f3fc'})}})}else{const end={x:origin.x+Math.cos(attack.angle)*1100,y:origin.y+Math.sin(attack.angle)*1100};if(pointLineDistance(g.player,origin,end)<42+g.player.r)hitPlayer(32)}}
    function pointLineDistance(p,a,b){const dx=b.x-a.x,dy=b.y-a.y;const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy))}
    function destroyEnemy(i){const e=g.enemies[i],wasFull=g.energy>=100;g.enemies.splice(i,1);g.kills++;g.energy=clamp(g.energy+g.m.gain,0,100);if(!wasFull&&g.energy>=100)g.energyLog.push({ready:g.t,fired:null});if(g.kills%20===0){g.hp=clamp(g.hp+10,0,100);g.banner=1.4;g.status='擊殺 20 隻：生命回復 10%'}for(let n=0;n<8;n++)g.particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,life:.45,color:e.color})}
    function breakShield(){if(!g.run||g.energy<100)return;const record=[...g.energyLog].reverse().find(v=>v.fired===null);if(record)record.fired=g.t;g.energy=0;g.breaks++;g.boss=clamp(100-(g.breaks/g.m.breaks)*100,0,100);g.weak=4.5;g.banner=2;g.status='護盾破碎！Boss 虛弱中';for(let n=0;n<48;n++){const a=Math.random()*Math.PI*2,s=50+Math.random()*220;g.particles.push({x:W/2,y:92,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.8,color:'#fbbf24'})}if(g.boss<=0)finish(true)}
    function hitPlayer(dmg){const p=g.player;if(p.hit>0)return;p.hit=2;g.hp-=dmg;g.particles.push({x:p.x,y:p.y,vx:0,vy:0,life:.5,color:'#fa7185'});if(g.hp<=0)finish(false)}
    function finish(win){g.run=false;cancelAnimationFrame(raf);$('endTitle').textContent=win?'核心已摧毀':'生命歸零';$('endResult').innerHTML=win?`以「${g.m.name}」節奏完成測試關卡。<br>通關時間：<b>${fmt(g.t)}</b> ・ 擊殺小怪：${g.kills} 隻`:`你存活了 <b>${fmt(g.t)}</b>。<br>擊殺小怪：${g.kills} 隻 ・ 已破盾：${g.breaks}/${g.m.breaks} 次`;$('endResult').style.color=win?'#a7f3d0':'#fecdd3';end.style.display='grid'}
    function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
    function update(dt){const p=g.player;g.t+=dt;let mx=(keys.d?1:0)-(keys.a?1:0),my=(keys.s?1:0)-(keys.w?1:0);if(mx||my){const length=Math.hypot(mx,my);p.x=clamp(p.x+mx/length*p.speed*dt,p.r,W-p.r);p.y=clamp(p.y+my/length*p.speed*dt,p.r,H-p.r)}g.spawn-=dt;const rate=g.t<20?.95:Math.max(.5,.95-g.t*.006);if(g.spawn<=0){spawnEnemy();g.spawn=rate}g.shot-=dt;if(g.shot<=0){fire();g.shot=.3}if(g.t>=g.nextPattern){startAttack();g.nextPattern+=15}if(g.attack){g.attack.timer-=dt;if(g.attack.phase==='warn'&&g.attack.timer<=0){bossFire(g.attack);g.attack.phase='fire';g.attack.timer=g.attack.type===2?.75:.35;g.status=g.attack.type===1?'閃電轟炸！':g.attack.type===2?'雷射發射！':'扇形彈幕發射！'}else if(g.attack.phase==='fire'&&g.attack.timer<=0){g.attack=null;if(g.weak<=0)g.status='殲滅小怪，蒐集能量'}}if(g.weak>0){g.weak-=dt;if(g.weak<=0&&!(g.attack&&g.attack.phase==='fire'))g.status='殲滅小怪，蒐集能量'}p.hit=Math.max(0,p.hit-dt);
      for(let i=g.enemies.length-1;i>=0;i--){const e=g.enemies[i],a=Math.atan2(p.y-e.y,p.x-e.x),speed=e.speed*(g.weak>0?.48:1);e.x+=Math.cos(a)*speed*dt;e.y+=Math.sin(a)*speed*dt;if(dist(e,p)<e.r+p.r){hitPlayer(8);g.enemies.splice(i,1)}}
      for(let i=g.shots.length-1;i>=0;i--){const s=g.shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;let dead=s.life<0||s.x<0||s.x>W||s.y<0||s.y>H;for(let j=g.enemies.length-1;j>=0&&!dead;j--){if(dist(s,g.enemies[j])<s.r+g.enemies[j].r){g.enemies[j].hp--;dead=true;if(g.enemies[j].hp<=0)destroyEnemy(j)}}if(dead)g.shots.splice(i,1)}
      for(let i=g.bossShots.length-1;i>=0;i--){const b=g.bossShots[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(dist(b,p)<b.r+p.r){hitPlayer(14);g.bossShots.splice(i,1)}else if(b.life<0||b.y>H+20||b.x<-20||b.x>W+20)g.bossShots.splice(i,1)}
      for(let i=g.particles.length-1;i>=0;i--){let q=g.particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<0)g.particles.splice(i,1)}
    }
    function circle(o,col,alpha=1){x.globalAlpha=alpha;x.fillStyle=col;x.beginPath();x.arc(o.x,o.y,o.r,0,Math.PI*2);x.fill();x.globalAlpha=1}
    function draw(){x.clearRect(0,0,W,H);x.fillStyle='#070d1e';x.fillRect(0,0,W,H);x.strokeStyle='#172747';x.lineWidth=1;for(let i=0;i<=W;i+=48){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<=H;i+=48){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
      if(g.attack){const a=g.attack;x.save();x.globalAlpha=a.phase==='warn'?.28:.65;x.fillStyle='#a5f3fc';x.strokeStyle='#c4b5fd';if(a.type===0){x.beginPath();x.moveTo(W/2,92);x.arc(W/2,92,580,a.angle-1.15,a.angle+1.15);x.closePath();x.fill()}if(a.type===1){a.spots.forEach(s=>{x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill()})}if(a.type===2){x.lineWidth=58;x.beginPath();x.moveTo(W/2,92);x.lineTo(W/2+Math.cos(a.angle)*1100,92+Math.sin(a.angle)*1100);x.stroke()}x.restore()}
      const core={x:W/2,y:92,r:33};x.save();x.translate(core.x,core.y);x.rotate(g.t*.4);x.strokeStyle=g.weak>0?'#fef3c7':'#fbbf24';x.lineWidth=4;x.beginPath();x.arc(0,0,core.r+8,0,Math.PI*2);x.stroke();x.fillStyle=g.weak>0?'#fde68a':'#7c4a12';x.beginPath();x.arc(0,0,core.r,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(0,0,10,0,Math.PI*2);x.fill();x.restore();
      g.enemies.forEach(e=>circle(e,e.color));g.shots.forEach(s=>circle(s,'#d9fffb'));g.bossShots.forEach(b=>circle(b,'#a5f3fc'));g.particles.forEach(q=>circle({x:q.x,y:q.y,r:2.5},q.color,clamp(q.life*2,0,1)));const p=g.player;if(p.hit>0&&Math.floor(p.hit*18)%2===0){}else{circle(p,'#55e6d1');x.strokeStyle='#d9fffb';x.lineWidth=2;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x+(mouse.x-p.x)*.22,p.y+(mouse.y-p.y)*.22);x.stroke()}if(g.energy>=100){x.strokeStyle='#55e6d1';x.lineWidth=3;x.beginPath();x.arc(p.x,p.y,23+Math.sin(g.t*9)*3,0,Math.PI*2);x.stroke()}
    }
    function ui(){$('timer').textContent=fmt(g.t);$('hpText').textContent=Math.ceil(g.hp)+'/100';$('hpBar').style.width=g.hp+'%';$('bossText').textContent=Math.ceil(g.boss)+'/100';$('bossBar').style.width=g.boss+'%';$('energyText').textContent=Math.floor(g.energy)+'/100';$('energyBar').style.width=g.energy+'%';if(g.attack&&g.attack.phase==='warn'){const name=['扇形彈幕','閃電轟炸','鎖定雷射'][g.attack.type];$('status').textContent='警告：'+name+' 將在 '+Math.max(0,g.attack.timer).toFixed(1)+' 秒後發動'}else if(g.weak>0)$('status').textContent='護盾破碎！Boss 虛弱中 '+g.weak.toFixed(1)+' 秒';else if(g.energy>=100)$('status').textContent='能量已滿！按空白鍵發動破盾攻擊'}
    function loop(now){if(!g.run)return;const dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();ui();raf=requestAnimationFrame(loop)}
    function renderEnergyLog(){const list=g.energyLog;if(!list.length)return '本局尚未集滿任何一次破盾能量。';return list.map((v,i)=>{const fired=v.fired===null?'尚未發射':fmt(v.fired)+' 發射（等待 '+(v.fired-v.ready).toFixed(1)+' 秒）';return `${i+1}. ${fmt(v.ready)} 集滿 → ${fired}`}).join('<br>')}
    c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k in keys){keys[k]=true;e.preventDefault()}if(e.code==='Space'){e.preventDefault();breakShield()}});window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in keys){keys[k]=false;e.preventDefault()}});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>newGame(b.dataset.mode)));$('logToggle').addEventListener('click',()=>{const box=$('energyLog');box.hidden=!box.hidden;if(!box.hidden){box.innerHTML=renderEnergyLog();$('logToggle').textContent='收起能量紀錄'}else $('logToggle').textContent='查看能量紀錄'});$('restart').addEventListener('click',()=>{cancelAnimationFrame(raf);hud.hidden=true;end.style.display='none';start.style.display='grid'});
    // Idle title screen background
    x.fillStyle='#070d1e';x.fillRect(0,0,W,H);x.fillStyle='#14264d';x.beginPath();x.arc(W/2,H/2,130,0,Math.PI*2);x.fill();
  })();
  </script>
</body>
</html>
